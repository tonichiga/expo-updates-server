name: create-expo-updates-server CI

on:
  pull_request:
    paths:
      - ".github/workflows/create-expo-updates-server-ci.yml"
      - ".github/workflows/publish-create-expo-updates-server.yml"
      - ".gitignore"
      - "app/**"
      - "components/**"
      - "docker/**"
      - "docs/**"
      - "hooks/**"
      - "lib/**"
      - "packages/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "templates/**"
      - ".env.example"
      - ".env.docker.example"
      - "Dockerfile"
      - "LICENSE"
      - "README.md"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
      - "*.config.*"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the OTA client and configurator
        run: npm test

      - name: Build and test installer
        run: npm run installer:check

      - name: Test packed initializer, generated lockfile and Docker startup
        run: npm run installer:pack-smoke -- --docker

      - name: Install the browser for the release console tests
        run: npx playwright install --with-deps chromium

      - name: Verify database upgrades, signed OTA delivery and the release console
        run: |
          minio_image=$(docker image ls --filter 'reference=ota-smoke-*-minio:latest' --format '{{.ID}}')
          docker image inspect "$minio_image" > /dev/null
          OTA_E2E_MINIO_IMAGE="$minio_image" npm run test:e2e

      - name: Build documentation
        run: npm run docs:build
