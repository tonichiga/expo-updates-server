# Local test fallback: upstream MinIO container images are no longer public.
services:
  minio:
    image: ota-test-minio:2025-10-15
    build:
      context: .
      dockerfile: docker/minio-test.Dockerfile
  minio-init:
    image: ota-test-app
    pull_policy: never
    entrypoint: ["node", "/app/scripts/ensure-test-bucket.mjs"]
  app:
    image: ota-test-app
    ports: !override
      - "127.0.0.1:${OTA_HTTP_PORT:-3100}:3000"
